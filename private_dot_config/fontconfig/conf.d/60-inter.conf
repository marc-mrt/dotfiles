<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <!-- Default sans-serif: Inter -->
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>Inter</family>
        </prefer>
    </alias>

    <!-- Default monospace: Maple Mono -->
    <alias>
        <family>monospace</family>
        <prefer>
            <family>Maple Mono</family>
        </prefer>
    </alias>
</fontconfig>
