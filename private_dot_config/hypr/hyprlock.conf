# Load colors from hypr generated file
source = ~/.config/hypr/hyprlock-colors.conf

# ── General ───────────────────────────────────────────────
general {
    no_fade_in          = false
    grace               = 0
    disable_loading_bar = false
    hide_cursor         = true
}

# ── Background ────────────────────────────────────────────
background {
    monitor     =
    blur_passes = 2
    blur_size   = 6
    brightness  = 0.6
    path = /home/marc/.local/share/wallpapers/wallpaper.jpg
}

# ── Clock ─────────────────────────────────────────────────
label {
    monitor     =
    text        = $TIME
    color       = $ml_text
    font_size   = 160
    font_family = Noto Sans Bold
    position    = 0, -80
    halign      = center
    valign      = top
}

# ── Date ──────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:43200000] date +"%A, %d %B %Y"
    color       = $ml_subtext
    font_size   = 22
    font_family = Noto Sans
    position    = 0, -350
    halign      = center
    valign      = top
}

# ── Input field ───────────────────────────────────────────
input-field {
    monitor           =
    size              = 460, 64
    outline_thickness = 2
    dots_size         = 0.22
    dots_spacing      = 0.35
    dots_center       = true
    dots_rounding     = -1
    outer_color       = $ml_primary
    inner_color       = $ml_surface
    font_color        = $ml_text
    font_family       = Noto Sans
    fade_on_empty     = false
    placeholder_text  = <span alpha="45%">Type password</span>
    hide_input        = false
    rounding          = 20
    check_color       = $ml_success
    fail_color        = $ml_error
    fail_text         =
    fail_transition   = 300
    position          = 0, 140
    halign            = center
    valign            = bottom
}

# ── Auth message (reserved slot under input, no drift) ────
label {
    monitor     =
    text        = $FAIL
    color       = $ml_error
    font_size   = 15
    font_family = Noto Sans
    position    = 0, 104
    halign      = center
    valign      = bottom
}

# ── Battery ───────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:5000] cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | awk '{print $1"%"}' || echo ""
    color       = $ml_subtext
    font_size   = 14
    font_family = Noto Sans
    position    = -1%, 1%
    halign      = right
    valign      = bottom
}
