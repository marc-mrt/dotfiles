# Cursor theme for Hyprland (hyprcursor) and X11/XWayland (xcursor).
# Fetched from upstream instead of copied: the release zip stores its cursor
# aliases (left_ptr, arrow, hand2, ...) as symlinks, and a flattened copy breaks
# the arrow in XWayland apps (Steam, Wine). Linux-only via .chezmoiignore.
[".local/share/icons/catppuccin-latte-light-cursors"]
    type = "archive"
    url = "https://github.com/catppuccin/cursors/releases/download/v2.0.0/catppuccin-latte-light-cursors.zip"
    checksum.sha256 = "4c0752cfa2da6c4cbcfe9539ca92585144b34651f22acf6cecf18850cb938880"
    stripComponents = 1
    exact = true

# chef, Marc's agent stack. A private repo: a new machine needs
# `gh auth login && gh auth setup-git` before the first apply.
# chef owns its symlinks; run_onchange_after_chef-install runs its installer.
["Code/chef"]
    type = "git-repo"
    url = "https://github.com/marc-mrt/chef.git"
    refreshPeriod = "168h"

# opencode's always-on layer, loaded by path from opencode.jsonc. caveman and
# i-have-adhd are not on npm; all three come the same way so nothing is copied.
[".config/opencode/vendor/caveman"]
    type = "git-repo"
    url = "https://github.com/JuliusBrussee/caveman.git"
    refreshPeriod = "168h"
    clone.args = ["--depth", "1"]

[".config/opencode/vendor/ponytail"]
    type = "git-repo"
    url = "https://github.com/DietrichGebert/ponytail.git"
    refreshPeriod = "168h"
    clone.args = ["--depth", "1"]

[".config/opencode/vendor/i-have-adhd"]
    type = "git-repo"
    url = "https://github.com/ayghri/i-have-adhd.git"
    refreshPeriod = "168h"
    clone.args = ["--depth", "1"]
